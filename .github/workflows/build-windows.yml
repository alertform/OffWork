name: Build OffWork Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test calculation logic
        shell: pwsh
        run: dotnet test tests/DwhOffWork.Core.Tests/DwhOffWork.Core.Tests.csproj -c Release

      - name: Publish x64 single-file EXE
        shell: pwsh
        run: >-
          dotnet publish src/DwhOffWork/DwhOffWork.csproj
          -c Release
          -r win-x64
          -p:Platform=x64
          -o artifacts/win-x64

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = 'artifacts/win-x64/OffWork.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: OffWork-win-x64
          path: artifacts/win-x64/OffWork.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          一只陪你等下班的小猫悬浮窗。

          - 实时显示下班倒计时、工作进度和今日已赚金额
          - 支持跨午夜班次、设置持久化和窗口置顶
          - 自定义小猫标题栏，支持 Windows 深色/浅色主题
          - Windows x64 单文件版本，无需安装

          首次启动可能需要几秒钟解压自带运行组件。该版本尚未进行代码签名，Windows 可能显示安全提示。
          "@ | Set-Content release-notes.md -Encoding utf8

          gh release create $env:GITHUB_REF_NAME `
            "artifacts/win-x64/OffWork.exe#OffWork.exe" `
            --repo $env:GITHUB_REPOSITORY `
            --title "OffWork $env:GITHUB_REF_NAME" `
            --notes-file release-notes.md
