name: Build OffWork Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure native x64 build
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build native release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run calculation tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/win-x64 | Out-Null
          Copy-Item build/Release/OffWork.exe artifacts/win-x64/OffWork.exe

          $exe = Get-Item artifacts/win-x64/OffWork.exe
          if ($exe.Length -gt 10MB) {
            throw "Native executable unexpectedly exceeds 10 MB: $($exe.Length) bytes"
          }
          $hash = Get-FileHash $exe.FullName -Algorithm SHA256
          $exe | Format-List Name, Length, LastWriteTime
          $hash | Format-List Algorithm, Hash

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: OffWork-win-x64
          path: artifacts/win-x64/OffWork.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          一只陪你等下班的小猫悬浮窗。

          - 原生 C++/Win32，无 .NET 或 WinUI 运行时
          - 实时显示下班倒计时、工作进度和今日已赚金额
          - 支持跨午夜班次、设置持久化、单实例和窗口置顶
          - 内嵌多尺寸小猫图标，单文件免安装

          该版本尚未进行代码签名，Windows 可能显示安全提示。
          "@ | Set-Content release-notes.md -Encoding utf8

          gh release create $env:GITHUB_REF_NAME `
            "artifacts/win-x64/OffWork.exe#OffWork.exe" `
            --repo $env:GITHUB_REPOSITORY `
            --title "OffWork $env:GITHUB_REF_NAME" `
            --notes-file release-notes.md
